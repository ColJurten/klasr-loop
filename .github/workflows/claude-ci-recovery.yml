# Secure CI-completion handler. Runs in the DEFAULT-BRANCH context with the
# trusted revision only (workflow_run never executes PR code here).
# Agent-PR failure  -> bounded repair dispatch (worker enforces the cycle cap).
# Protected-branch failure -> deterministic fingerprinted issue, NO Claude session.
name: claude-ci-recovery

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: write # repository_dispatch (Actions reruns are performed only by the trusted VPS publisher)
  issues: write # fingerprinted protected-branch issues
  actions: read # failed-job logs
  pull-requests: read # resolve the current agent PR

concurrency:
  group: klasr-ci-recovery-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/agent
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pnpm install --frozen-lockfile --filter @klasr/agent-orchestration
      - name: Resolve current PR head, failed jobs, live status, and Agent Control lifecycle
        id: repair
        env:
          GH_TOKEN: ${{ github.token }}
          SUPERVISOR_ACTORS: ${{ vars.SUPERVISOR_ACTORS }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number,headRefOid --jq '.[0] // {}')
          issue=$(sed -nE 's#^(feature|fix)/([0-9]+)-.*#\2#p' <<< "$BRANCH")
          cycle=0
          agent_attempt=1
          if [ -n "$issue" ]; then
            gh api "repos/$REPO/issues/$issue/comments?per_page=100" --paginate --slurp > /tmp/control-comments.json
            node scripts/agent/lib/trusted-comments.mjs /tmp/control-comments.json klasr-agent-state body > /tmp/control.md
            read -r cycle agent_attempt < <(node -e 'import("./scripts/agent/lib/control.mjs").then(async m=>{const {readFileSync}=await import("node:fs");const c=m.parseControl(readFileSync("/tmp/control.md","utf8"));console.log(c?c.cycle:0,c?c.lifecycle.attempt:1)})')
          else
            : > /tmp/control.md
          fi
          read -r cycle agent_attempt < <(node -e 'const [cycle,attempt]=process.argv.slice(1).map(Number);if(!Number.isInteger(cycle)||cycle<0||!Number.isInteger(attempt)||attempt<1)throw Error("invalid control lineage");console.log(cycle,attempt)' "$cycle" "$agent_attempt")
          {
            echo "current_pr_head_sha=$(jq -r '.headRefOid // empty' <<< "$pr")"
            echo "failed_job=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '[.jobs[] | select(.conclusion=="failure")][0].name // "unknown"')"
            echo "failed_jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '[.jobs[] | select(.conclusion=="failure") | .name] | join(",")')"
            echo "live_status_state=$(gh api "repos/$REPO/commits/${{ github.event.workflow_run.head_sha }}/statuses" --jq '[.[] | select(.context=="klasr/live-google")][0].state // "missing"')"
            echo "cycle=$cycle"
            echo "agent_attempt=$agent_attempt"
          } >> "$GITHUB_OUTPUT"
      - name: Normalize event and decide
        id: decide
        env:
          SUPERVISOR_ACTORS: ${{ vars.SUPERVISOR_ACTORS }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          CURRENT_PR_HEAD_SHA: ${{ steps.repair.outputs.current_pr_head_sha }}
          FAILED_JOB: ${{ steps.repair.outputs.failed_job }}
          FAILED_JOBS: ${{ steps.repair.outputs.failed_jobs }}
          LIVE_STATUS_STATE: ${{ steps.repair.outputs.live_status_state }}
          REPAIR_CYCLE: ${{ steps.repair.outputs.cycle }}
          CURRENT_AGENT_ATTEMPT: ${{ steps.repair.outputs.agent_attempt }}
        run: node scripts/agent/normalize-event.mjs "workflow_run" "$GITHUB_EVENT_PATH"

      - name: Dispatch current-head review or bounded repair
        if: steps.decide.outputs.action == 'dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH: ${{ steps.decide.outputs.dispatch }}
        run: gh api "repos/${{ github.repository }}/dispatches" --input - <<< "$DISPATCH"

      - name: Fingerprint + create/update issue (protected-branch failure)
        if: steps.decide.outputs.action == 'protected-branch-failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          failed_job=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.conclusion=="failure")][0].name' 2>/dev/null || echo "unknown")
          # First failing step name = stable-enough error signature without log scraping
          signature=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.conclusion=="failure") | .steps[] | select(.conclusion=="failure")][0].name' 2>/dev/null || echo "unknown-step")
          jq -n --arg cat "ci-failure-protected" --arg wf "ci" --arg job "$failed_job" \
                --arg path "$BRANCH" --arg sig "$signature" \
                --arg title "ci: échec sur $BRANCH — job $failed_job" \
                --arg url "$RUN_URL" --arg sha "$SHA" \
                '{category:$cat, workflow:$wf, job:$job, path:$path, signature:$sig, title:$title, run_url:$url, head_sha:$sha, evidence:$sig}' \
                > /tmp/finding.json
          node scripts/agent/fingerprint-issue.mjs /tmp/finding.json > /tmp/issue.json
          fp=$(jq -r .fingerprint /tmp/issue.json)
          existing=$(gh issue list --state open --search "klasr-fingerprint:$fp in:body" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body "Recurrence: run $RUN_URL (commit $SHA)."
            echo "::notice::updated existing issue #$existing (fingerprint $fp)"
          else
            gh issue create \
              --title "$(jq -r .title /tmp/issue.json)" \
              --body "$(jq -r .body /tmp/issue.json)" \
              --label "bug" --label "ci-failure" --label "agent:needs-spec"
          fi
