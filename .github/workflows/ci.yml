name: ci

on:
  pull_request:
    branches: [main, develop, hermes-oneshot]
  push:
    branches: [main]

permissions:
  contents: read
  statuses: read
  checks: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Workflow validation
        uses: docker://rhysd/actionlint:1.7.7
      - name: Hygiene
        run: |
          git diff --check
          test -z "$(git ls-files '*.log' '.env' '.agent/evidence/*.json')"

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: klasr }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @klasr/api prisma:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/klasr
      - run: pnpm test:integration
      - run: pnpm test:integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @klasr/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            .tmp/hermes/drive-reference-organization-flow/local-desktop-dashboard.sanitized.png
            .tmp/hermes/drive-reference-organization-flow/local-mobile-390-dashboard.sanitized.png
          if-no-files-found: ignore
          retention-days: 14

  live-google-status:
    runs-on: ubuntu-latest
    steps:
      - name: Require trusted live evidence for the current internal PR head
        env:
          ENABLED: ${{ vars.KLASR_LIVE_GOOGLE_ENABLED }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$ENABLED" != true ] || [ "$IS_PR" != true ] || [ "$IS_FORK" = true ]; then exit 0; fi
          node - <<'NODE'
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.REPOSITORY}/commits/${process.env.HEAD_SHA}/statuses?per_page=100`, {
            headers: { accept: 'application/vnd.github+json', authorization: `Bearer ${process.env.GH_TOKEN}`, 'x-github-api-version': '2022-11-28' },
          });
          if (!response.ok) throw new Error(`GitHub statuses API returned ${response.status}`);
          const status = (await response.json()).find((item) => item.context === 'klasr/live-google');
          if (!status || status.sha !== process.env.HEAD_SHA || status.state !== 'success') {
            throw new Error('Current klasr/live-google status is missing, stale, pending, or failed');
          }
          NODE

  gate:
    if: always()
    needs: [quality, integration, e2e, live-google-status]
    runs-on: ubuntu-latest
    steps:
      - name: Require deterministic jobs and any enabled live acceptance
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*) exit 1 ;;
          esac
          test "${{ needs.quality.result }}" = success
          test "${{ needs.integration.result }}" = success
          test "${{ needs.e2e.result }}" = success
          test "${{ needs.live-google-status.result }}" = success
