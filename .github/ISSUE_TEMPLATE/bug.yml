name: Bug report
description: Something in Klasr does not work as specified
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Actual vs expected behavior }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [api, web, intelligence, infra]
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version / commit }
