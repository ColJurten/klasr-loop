name: Feature request
description: New capability or improvement
labels: [feature, triage]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem / user story, description: "As a <persona>, I want ... so that ..." }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution }
  - type: textarea
    id: reac
    attributes: { label: REAC competency demonstrated (if any) }
