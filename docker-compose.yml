# Stack de dev locale — Backend Python/FastAPI (apps/api-py) + PostgreSQL + MongoDB.
# ADR-007 : la file de jobs est en PostgreSQL (SKIP LOCKED, sans pg-boss ni Redis).
services:
  api:
    profiles: [api]
    build:
      context: apps/api-py
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      KLASR_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/klasr
      KLASR_MONGO_URL: mongodb://mongo:27017
      NODE_ENV: development
      INTERNAL_API_SECRET: replace-with-a-local-shared-secret
      TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      GOOGLE_CLIENT_ID: replace-with-google-client-id
      GOOGLE_CLIENT_SECRET: replace-with-google-client-secret
      KLASR_LOCAL_MVP: 'true'
      KLASR_INLINE_WORKER: 'true'
    command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 3001 --app-dir src"]
    depends_on:
      - postgres
      - mongo

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: klasr
    ports: ['127.0.0.1:5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]

  mongo:
    image: mongo:7
    ports: ['127.0.0.1:27017:27017']
    volumes: [mongodata:/data/db]

volumes:
  pgdata:
  mongodata:
