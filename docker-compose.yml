# Stack de dev locale — ADR-002/003/004 : PostgreSQL (métier + jobs pg-boss)
# et MongoDB (collection `analyses`, compétence NoSQL). Ni Redis, ni MinIO.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: klasr
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]

  mongo:
    image: mongo:7
    ports: ['27017:27017']
    volumes: [mongodata:/data/db]

volumes:
  pgdata:
  mongodata:
