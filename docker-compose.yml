# DEVELOPMENT stack: runs dev servers with the acceptance path available.
# Production deployments use the Dockerfile runtime image.
# Full local stack: docker compose --profile api up --build
# Follow analysis progress (Docling/RapidOCR/LLM): docker compose logs -f worker api
# Stop the stack: docker compose --profile api down
# Required local .env values: INTERNAL_API_SECRET, TOKEN_ENCRYPTION_KEY,
# GOOGLE_CLIENT_ID, and GOOGLE_CLIENT_SECRET. LLM credentials are entered in the UI.
# NEXT_PUBLIC_KLASR_ACCEPTANCE_GOOGLE_SERVICE_ACCOUNT is baked into the web image at build time.
# ADR-007: the job queue lives in PostgreSQL (SKIP LOCKED, without pg-boss or Redis).

x-api-image: &api-image
  image: klasr-api:local
  build:
    context: apps/api-py

x-api-environment: &api-environment
  KLASR_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/klasr
  KLASR_MONGO_URL: mongodb://mongo:27017
  NODE_ENV: development
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-replace-with-a-local-shared-secret}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-replace-with-google-client-id}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-replace-with-google-client-secret}

x-database-dependencies: &database-dependencies
  postgres:
    condition: service_healthy
  mongo:
    condition: service_healthy

services:
  api:
    <<: *api-image
    profiles: [api]
    ports:
      - '127.0.0.1:3001:3001'
    environment: *api-environment
    command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 3001 --app-dir src"]
    depends_on: *database-dependencies
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    <<: *api-image
    profiles: [api]
    environment:
      <<: *api-environment
      KLASR_WORKER: "true"
    command: ["python", "src/worker.py"]
    depends_on: *database-dependencies

  # Open the app at exactly http://localhost:3000 (the Google-registered callback host).
  # Using 127.0.0.1:3000 breaks the OAuth state cookie because the browser cookie host differs from the callback host.
  web:
    profiles: [api]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: build
      args:
        NEXT_PUBLIC_KLASR_ACCEPTANCE_GOOGLE_SERVICE_ACCOUNT: ${NEXT_PUBLIC_KLASR_ACCEPTANCE_GOOGLE_SERVICE_ACCOUNT:-false}
    working_dir: /app/apps/web
    command: ["npx", "next", "dev", "-H", "0.0.0.0", "-p", "3000"]
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NEXTAUTH_URL: http://localhost:3000
      API_URL: http://api:3001/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-replace-with-a-local-nextauth-secret}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-replace-with-a-local-shared-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-replace-with-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-replace-with-google-client-secret}
      KLASR_ACCEPTANCE_GOOGLE_SERVICE_ACCOUNT: ${KLASR_ACCEPTANCE_GOOGLE_SERVICE_ACCOUNT:-false}
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: klasr
    ports: ['127.0.0.1:5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d klasr"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:7
    ports: ['127.0.0.1:27017:27017']
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  mongodata:
