services:
  api:
    ports: !override ["127.0.0.1:3101:3001"]
    environment:
      KLASR_ACCEPTANCE_GOOGLE_SERVICE_ACCOUNT: "${KLASR_ACCEPTANCE_GOOGLE_SERVICE_ACCOUNT}"
      NEXT_PUBLIC_KLASR_ACCEPTANCE_GOOGLE_SERVICE_ACCOUNT: "${NEXT_PUBLIC_KLASR_ACCEPTANCE_GOOGLE_SERVICE_ACCOUNT}"
      KLASR_GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account.json
      KLASR_GOOGLE_DRIVE_ROOT_ID: "${KLASR_GOOGLE_DRIVE_ROOT_ID}"
    volumes:
      - "${KLASR_SA_FILE_OVERRIDE}:/run/secrets/google-service-account.json:ro"
  worker:
    environment:
      KLASR_ACCEPTANCE_GOOGLE_SERVICE_ACCOUNT: "${KLASR_ACCEPTANCE_GOOGLE_SERVICE_ACCOUNT}"
      NEXT_PUBLIC_KLASR_ACCEPTANCE_GOOGLE_SERVICE_ACCOUNT: "${NEXT_PUBLIC_KLASR_ACCEPTANCE_GOOGLE_SERVICE_ACCOUNT}"
      KLASR_GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account.json
      KLASR_GOOGLE_DRIVE_ROOT_ID: "${KLASR_GOOGLE_DRIVE_ROOT_ID}"
    volumes:
      - "${KLASR_SA_FILE_OVERRIDE}:/run/secrets/google-service-account.json:ro"
  web:
    ports: !override ["127.0.0.1:3100:3000"]
    environment:
      NEXTAUTH_URL: http://localhost:3100
      NEXT_PUBLIC_API_URL: http://localhost:3101/api/v1
      KLASR_ACCEPTANCE_GOOGLE_SERVICE_ACCOUNT: "${KLASR_ACCEPTANCE_GOOGLE_SERVICE_ACCOUNT}"
      NEXT_PUBLIC_KLASR_ACCEPTANCE_GOOGLE_SERVICE_ACCOUNT: "${NEXT_PUBLIC_KLASR_ACCEPTANCE_GOOGLE_SERVICE_ACCOUNT}"
    build:
      args:
        NEXT_PUBLIC_KLASR_ACCEPTANCE_GOOGLE_SERVICE_ACCOUNT: "${NEXT_PUBLIC_KLASR_ACCEPTANCE_GOOGLE_SERVICE_ACCOUNT}"
  postgres:
    ports: !override ["127.0.0.1:55432:5432"]
